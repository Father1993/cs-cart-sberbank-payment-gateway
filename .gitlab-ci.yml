image: debian:12

stages:
  - deploy

deploy_dev:
  stage: deploy
  tags:
    - Deploy
  only:
    - dev
  variables:
    SERVER_IP: "10.0.0.20"
    PROJECT_PATH: "/var/www/html"
    SITE_DIR: "dev-uroven.pro"
    REPO_DIR: "repo/cs-cart-as_sberpay_api"
    ADDON_ID: "as_sberpay_api"
    CSCART_SDK_PATH: "/home/devuser/.config/composer/vendor/bin/cscart-sdk"
  before_script:
    - apt-get update -qq && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      sed -i '/^$/d' ~/.ssh/id_ed25519
      if ! head -1 ~/.ssh/id_ed25519 | grep -q "BEGIN"; then
        echo "Ошибка: SSH ключ не начинается с BEGIN"
        exit 1
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 devuser@$SERVER_IP "
        set -e
        cd $PROJECT_PATH/$REPO_DIR || {
          echo 'Ошибка: директория $PROJECT_PATH/$REPO_DIR не найдена'
          exit 1
        }
        git fetch origin
        git checkout dev
        git pull origin dev
        cd $PROJECT_PATH
        echo 'Обновляем симлинк для модуля $ADDON_ID...'
        $CSCART_SDK_PATH addon:symlink $ADDON_ID $REPO_DIR $SITE_DIR --templates-to-design
        echo '✅ Dev деплой завершён успешно'
      "
  environment:
    name: development
    url: https://dev-uroven.pro

deploy_prod:
  stage: deploy
  tags:
    - Deploy
  only:
    - main
  when: manual
  variables:
    SERVER_IP: "10.0.0.30"
    PROJECT_PATH: "/var/www/html"
    SITE_DIR: "uroven.pro"
    REPO_DIR: "repo/cs-cart-as_sberpay_api"
    ADDON_ID: "as_sberpay_api"
    CSCART_SDK_PATH: "/home/produser/.config/composer/vendor/bin/cscart-sdk"
  before_script:
    - apt-get update -qq && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      sed -i '/^$/d' ~/.ssh/id_ed25519
      if ! head -1 ~/.ssh/id_ed25519 | grep -q "BEGIN"; then
        echo "Ошибка: SSH ключ не начинается с BEGIN"
        exit 1
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 produser@$SERVER_IP "
        set -e
        cd $PROJECT_PATH/$REPO_DIR || {
          echo 'Ошибка: директория $PROJECT_PATH/$REPO_DIR не найдена'
          exit 1
        }
        git fetch origin
        git checkout main
        git pull origin main
        cd $PROJECT_PATH
        echo 'Обновляем симлинк для модуля $ADDON_ID...'
        $CSCART_SDK_PATH addon:symlink $ADDON_ID $REPO_DIR $SITE_DIR --templates-to-design
        echo '✅ Prod деплой завершён успешно'
      "
  environment:
    name: production
    url: https://uroven.pro